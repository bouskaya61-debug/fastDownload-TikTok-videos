<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikSave - تحميل فيديوهات TikTok</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #050505;
      color: white;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    .hero {
      text-align: center;
      padding: 80px 10px;
    }

    .logo {
      width: 65px;
      height: 65px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      color: black;
      border-radius: 18px;
      font-size: 35px;
      font-weight: bold;
    }

    h1 {
      font-size: 40px;
      margin: 25px 0 10px;
    }

    .description {
      color: #999;
      font-size: 17px;
      margin-bottom: 30px;
    }

    .box {
      display: flex;
      max-width: 700px;
      margin: auto;
      padding: 7px;
      background: #151515;
      border: 1px solid #292929;
      border-radius: 15px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 16px;
      border: 0;
      outline: 0;
      background: transparent;
      color: white;
      font-size: 16px;
      direction: ltr;
    }

    button {
      border: 0;
      border-radius: 10px;
      background: white;
      color: black;
      padding: 0 25px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      opacity: .85;
    }

    #message {
      margin-top: 20px;
      color: #aaa;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .feature {
      padding: 25px 15px;
      background: #101010;
      border: 1px solid #202020;
      border-radius: 15px;
      text-align: center;
    }

    .feature span {
      font-size: 30px;
    }

    .feature h3 {
      margin: 12px 0 8px;
    }

    .feature p {
      color: #888;
      margin: 0;
    }

    footer {
      text-align: center;
      color: #555;
      margin-top: 60px;
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 30px;
      }

      .box {
        flex-direction: column;
        gap: 8px;
      }

      button {
        height: 50px;
      }

      .features {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <section class="hero">

      <div class="logo">T</div>

      <h1>تحميل فيديوهات TikTok</h1>

      <p class="description">
        الصق رابط فيديو TikTok للحصول على خيارات التحميل
      </p>

      <div class="box">

        <input
          id="url"
          type="url"
          placeholder="ألصق رابط TikTok هنا..."
        >

        <button onclick="analyze()">
          تحليل الرابط
        </button>

      </div>

      <p id="message"></p>

    </section>

    <section class="features">

      <div class="feature">
        <span>⚡</span>
        <h3>سريع</h3>
        <p>واجهة بسيطة وسريعة</p>
      </div>

      <div class="feature">
        <span>📱</span>
        <h3>للهاتف</h3>
        <p>مصمم للعمل على الهاتف</p>
      </div>

      <div class="feature">
        <span>🔒</span>
        <h3>بسيط</h3>
        <p>بدون إنشاء حساب</p>
      </div>

    </section>

    <footer>
      © 2026 TikSave
    </footer>

  </div>

  <script>

    function analyze() {

      const url = document.getElementById("url").value.trim();
      const message = document.getElementById("message");

      if (!url) {
        message.textContent = "⚠️ ألصق رابط TikTok أولاً";
        return;
      }

      if (!url.includes("tiktok.com")) {
        message.textContent = "❌ الرابط ليس رابط TikTok";
        return;
      }

      message.textContent =
        "✅ تم التعرف على رابط TikTok — سنضيف نظام التحميل في الخطوة التالية.";

    }

  </script>

</body>
</html>
