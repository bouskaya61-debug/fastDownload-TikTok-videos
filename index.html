<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُحمل فيديوهات تيكتوك (Pro)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #0d0d0d;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .iphone-frame {
            background: #161618;
            border-radius: 48px;
            padding: 20px;
            border: 2px solid #2c2c2e;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
            width: 100%;
            max-width: 390px;
            position: relative;
        }

        .dynamic-island {
            width: 100px;
            height: 26px;
            background: #000000;
            border-radius: 20px;
            margin: 0 auto 15px auto;
        }

        .header-tools {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .lang-select option { background: #1c1c1e; }

        h1 {
            font-size: 18px;
            text-align: center;
            margin-bottom: 20px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border-radius: 12px;
            border: 1px solid #2c2c2e;
            background: #242426;
            color: #fff;
            font-size: 13px;
            outline: none;
        }

        .paste-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .submit-btn {
            position: relative;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(90deg, #ff0050, #00f2fe);
            color: #fff;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.7), transparent);
            transform: rotate(25deg);
            animation: slowShine 6s infinite ease-in-out;
        }

        @keyframes slowShine {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        .loader {
            display: none;
            margin: 15px auto;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00f2fe;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        .result-card {
            display: none;
            background: #242426;
            padding: 15px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .author-info img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
        }

        .author-details h4 { font-size: 13px; font-weight: 600; }
        .author-details span { font-size: 11px; color: #8e8e93; }

        .video-title {
            font-size: 12px;
            color: #d1d1d6;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        .dl-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 10px;
            font-weight: 500;
            font-size: 12px;
            cursor: pointer;
            margin-bottom: 8px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            transition: background 0.2s;
        }

        .dl-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .error-msg {
            color: #ff3b30;
            font-size: 12px;
            text-align: center;
            display: none;
            margin-bottom: 15px;
        }

        /* نافذة التعليمات */
        .driver-popover {
            background-color: #2c2c2e !important;
            color: #fff !important;
            border-radius: 14px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
        }
        .driver-popover-title { color: #fff !important; font-size: 14px !important; }
        .driver-popover-description { color: #e5e5ea !important; font-size: 12px !important; }
        .driver-popover-btn-next, .driver-popover-btn-prev {
            background: rgba(255, 255, 255, 0.2) !important;
            color: #fff !important;
            border-radius: 6px !important;
            font-size: 11px !important;
        }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <div class="dynamic-island"></div>

        <div class="header-tools">
            <div></div>
            <select class="lang-select" id="langSelect">
                <option value="ar">العربية 🇸🇦</option>
                <option value="en">English 🇺🇸</option>
            </select>
        </div>
        
        <h1><i class="fa-brands fa-tiktok"></i> مُحمل فيديوهات تيكتوك (Pro)</h1>
        
        <div class="input-wrapper" id="tour-input">
            <input type="text" id="videoUrl" placeholder="الصق رابط تيكتوك هنا...">
            <button class="paste-btn" onclick="playChime(); pasteURL();">لصق</button>
        </div>

        <button class="submit-btn" id="tour-submit" onclick="playChime(); fetchVideo();">تجميع الفيديو</button>

        <div class="loader" id="loader"></div>
        <div class="error-msg" id="errorMsg">تعذر جلب الفيديو، تأكد من صحة الرابط!</div>

        <div class="result-card" id="resultCard">
            <div class="author-info">
                <img id="avatar" src="" alt="Profile">
                <div class="author-details">
                    <h4 id="authorName">اسم الحساب</h4>
                    <span id="authorHandle">@username</span>
                </div>
            </div>
            <p class="video-title" id="videoTitle"></p>

            <!-- أزرار التحميل المباشر -->
            <button class="dl-btn" id="btnDlVideo" onclick="directDownload(videoMediaUrl, 'tiktok_video.mp4')">
                <i class="fa-solid fa-file-video"></i> تحميل الفيديو (بدون علامة)
            </button>
            <button class="dl-btn" id="btnDlAudio" onclick="directDownload(audioMediaUrl, 'tiktok_audio.mp3')">
                <i class="fa-solid fa-music"></i> تحميل الصوت فقط (MP3)
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>

    <script>
        let videoMediaUrl = "";
        let audioMediaUrl = "";

        // صوت هادئ وخفيف ("تننن...")
        function playChime() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);

                gain.gain.setValueAtTime(0.08, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch (e) {}
        }

        // دالة التحميل المباشر الفوري للملف
        async function directDownload(fileUrl, fileName) {
            playChime();
            try {
                const btn = event.currentTarget;
                const originalText = btn.innerHTML;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحميل...';

                // جلب الملف وتحويله لـ Blob لتنزيله مباشرة
                const response = await fetch(fileUrl);
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);

                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = url;
                a.download = fileName;
                document.body.appendChild(a);
                a.click();
                
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                
                btn.innerHTML = originalText;
            } catch (err) {
                // فتح الرابط كخيار احتياطي إذا منع السيرفر التحميل المباشر
                window.open(fileUrl, '_blank');
            }
        }

        async function pasteURL() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('videoUrl').value = text;
            } catch (err) {}
        }

        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');
            const errorMsg = document.getElementById('errorMsg');

            if (!urlInput) return;

            resultCard.style.display = 'none';
            errorMsg.style.display = 'none';
            loader.style.display = 'block';

            try {
                const response = await fetch(`https://api.tiklydown.eu.org/api/download?url=${encodeURIComponent(urlInput)}`);
                const data = await response.json();

                loader.style.display = 'none';

                if (data && data.video && data.video.noWatermark) {
                    document.getElementById('avatar').src = data.author.avatar || 'https://via.placeholder.com/36';
                    document.getElementById('authorName').innerText = data.author.name || 'مستخدم تيكتوك';
                    document.getElementById('authorHandle').innerText = '@' + (data.author.unique_id || 'tiktok');
                    document.getElementById('videoTitle').innerText = data.title || '';

                    videoMediaUrl = data.video.noWatermark;
                    audioMediaUrl = data.music.play_url || data.video.noWatermark;

                    resultCard.style.display = 'block';
                } else {
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                loader.style.display = 'none';
                errorMsg.style.display = 'block';
            }
        }

        // الجولة التعليمية التفاعلية
        const driver = window.driver.js.driver;
        const tourDriver = driver({
            showProgress: false,
            animate: true,
            nextBtnText: 'التالي ←',
            prevBtnText: '← السابق',
            doneBtnText: 'إنهاء',
            steps: [
                { 
                    element: '#tour-input', 
                    popover: { 
                        title: '💡 إدخال الرابط', 
                        description: 'ضع رابط فيديو تيكتوك هنا، أو اضغط زر "لصق" لنقله فوراً من الحافظة.' 
                    } 
                }
            ]
        });

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { tourDriver.drive(); }, 500);
        });
    </script>
</body>
</html>
