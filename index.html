<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تنزيل فيديوهات تيكتوك</title>
    <!-- FontAwesome & Driver.js CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            /* تفعيل التسريع العتادي للحركات السلسة (120 FPS) */
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .iphone-frame {
            background: #121212;
            border-radius: 45px;
            padding: 20px;
            border: 4px solid #2a2a2a;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8), inset 0 0 10px rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 400px;
            position: relative;
            will-change: transform;
        }

        .dynamic-island {
            width: 110px;
            height: 28px;
            background: #000;
            border-radius: 20px;
            margin: 0 auto 20px auto;
        }

        .lang-container {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
        }

        .lang-select {
            background: rgba(255, 255, 255, 0.1);
            color: #00f2fe;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            backdrop-filter: blur(10px);
        }

        .lang-select option { background: #1e1e1e; color: #fff; }

        h1 {
            font-size: 20px;
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
        }

        .input-wrapper {
            position: relative;
            margin-bottom: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border-radius: 14px;
            border: 1px solid #2c2c2e;
            background: #1c1c1e;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .paste-btn {
            position: absolute;
            left: 8px;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: #fff;
            padding: 6px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 12px;
            will-change: transform;
        }

        .submit-btn {
            position: relative;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #fe2c55, #00f2fe);
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            overflow: hidden;
            will-change: transform;
        }

        .submit-btn::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -150%;
            width: 50%;
            height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
            transform: rotate(25deg);
            animation: slowShine 6s infinite ease-in-out;
            will-change: left;
        }

        @keyframes slowShine {
            0% { left: -150%; }
            50% { left: 150%; }
            100% { left: 150%; }
        }

        /* تحسينات سلاسة Driver.js لأداء 120 FPS */
        .driver-popover {
            background-color: #1c1c1e !important;
            color: #fff !important;
            border-radius: 16px !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5) !important;
            transition: transform 0.25s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease !important;
            will-change: transform, opacity;
        }

        .driver-popover-title {
            color: #00f2fe !important;
            font-size: 15px !important;
            font-weight: bold !important;
        }

        .driver-popover-description {
            color: #ddd !important;
            font-size: 13px !important;
            line-height: 1.5 !important;
        }

        .driver-popover-btn-next, .driver-popover-btn-prev {
            background: #fe2c55 !important;
            color: #fff !important;
            border: none !important;
            text-shadow: none !important;
            border-radius: 8px !important;
            padding: 6px 12px !important;
            font-size: 12px !important;
            transition: transform 0.15s ease !important;
        }

        .driver-popover-btn-next:active {
            transform: scale(0.95);
        }

        .driver-popover-close-btn {
            color: #888 !important;
        }
    </style>
</head>
<body>

    <div class="iphone-frame">
        <div class="dynamic-island"></div>

        <div class="lang-container" id="tour-lang">
            <select class="lang-select" id="langSelect" onchange="changeLanguage()">
                <option value="ar">العربية 🇸🇦</option>
                <option value="en">English 🇺🇸</option>
                <option value="fr">Français 🇫🇷</option>
                <option value="es">Español 🇪🇸</option>
            </select>
        </div>
        
        <h1 id="txtTitle"><i class="fa-brands fa-tiktok"></i> تحميل فيديوهات تيكتوك</h1>
        
        <div class="input-wrapper" id="tour-input">
            <input type="text" id="videoUrl" placeholder="الصق رابط تيكتوك هنا...">
            <button class="paste-btn" id="btnPaste" onclick="pasteURL()">لصق</button>
        </div>

        <button class="submit-btn" id="tour-submit" onclick="fetchVideo()">تجميع الفيديو</button>
    </div>

    <!-- مكتبة التعليمات التفاعلية -->
    <script src="https://cdn.jsdelivr.net/npm/driver.js@1.3.1/dist/driver.js.iife.js"></script>

    <script>
        // تهيئة الجولة التفاعلية بسلاسة عالية
        const driver = window.driver.js.driver;

        const tourDriver = driver({
            showProgress: true,
            animate: true,
            nextBtnText: 'التالي ←',
            prevBtnText: '← السابق',
            doneBtnText: 'إنهاء',
            steps: [
                { 
                    element: '#tour-lang', 
                    popover: { 
                        title: 'تغيير اللغة', 
                        description: 'يمكنك التبديل بين 4 لغات مختلفة في أي وقت من هنا.' 
                    } 
                },
                { 
                    element: '#tour-input', 
                    popover: { 
                        title: 'إدخال الرابط', 
                        description: 'ضع رابط فيديو تيكتوك هنا، أو اضغط زر "لصق" لنقله فوراً من الحافظة.' 
                    } 
                },
                { 
                    element: '#tour-submit', 
                    popover: { 
                        title: 'بدء المعالجة', 
                        description: 'اضغط هنا للبدء في استخراج الفيديو والصوت بدون علامة مائية.' 
                    } 
                }
            ]
        });

        // تشغيل التعليمات تلقائياً عند أول زيارة للموقع
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                tourDriver.drive();
            }, 600);
        });

        async function pasteURL() {
            try {
                const text = await navigator.clipboard.readText();
                document.getElementById('videoUrl').value = text;
            } catch (err) {
                alert('يرجى السماح بالوصول للحافظة');
            }
        }

        async function fetchVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            if (!urlInput) return;
            alert("جاري المعالجة...");
        }
    </script>
</body>
</html>
