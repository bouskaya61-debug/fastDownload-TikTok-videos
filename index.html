<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحميل فيديوهات تيك توك بدون علامة مائية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
        }

        body {
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hero-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 50% 20%, rgba(139, 92, 246, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(236, 72, 153, 0.1), transparent 30%);
            z-index: -1;
        }

        header {
            padding: 20px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 15px;
            font-weight: 700;
        }

        h1 span {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 1.1rem;
            margin-bottom: 20px;
        }

        .ad-container {
            width: 100%;
            min-height: 90px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            overflow: hidden;
            color: #64748b;
            font-size: 12px;
        }

        .download-box {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 20px;
            display: flex;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            gap: 10px;
        }

        .download-box input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 16px;
            padding: 0 15px;
        }

        .download-box input::placeholder {
            color: #64748b;
        }

        .download-btn {
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            color: white;
            border: none;
            padding: 15px 35px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        #resultArea {
            display: none;
            margin-top: 20px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
        }

        #resultArea img {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: #22c55e;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.3s;
        }

        .action-btn:hover {
            background: #16a34a;
        }

        .action-btn.music {
            background: #0284c7;
        }

        .action-btn.music:hover {
            background: #0369a1;
        }

        #loading, #downloadStatus {
            display: none;
            margin-top: 20px;
            color: #ec4899;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #64748b;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 768px) {
            .download-box {
                flex-direction: column;
                background: transparent;
                border: none;
                padding: 0;
                box-shadow: none;
            }
            .download-box input {
                background: rgba(30, 41, 59, 0.8);
                border: 1px solid rgba(255, 255, 255, 0.1);
                padding: 15px;
                border-radius: 12px;
            }
            .download-btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>

    <div class="hero-bg"></div>

    <header>
        <div class="logo">
            <i class="fa-brands fa-tiktok"></i> SaveTok
        </div>
    </header>

    <main>
        <!-- إعلان 1: بنر علوي -->
        <div class="ad-container">
            <span>مساحة إعلانية - Banner Top</span>
        </div>

        <h1>تحميل فيديوهات تيك توك <span>بدون علامة مائية</span></h1>
        <p class="subtitle">ضع رابط الفيديو بالأسفل للتحميل الفوري المباشر.</p>

        <div class="download-box">
            <input type="text" id="videoUrl" placeholder="الصق رابط فيديو تيك توك هنا...">
            <button class="download-btn" onclick="fetchTikTokVideo()">
                <i class="fa-solid fa-download"></i> جلب الفيديو
            </button>
        </div>

        <div id="loading">
            <i class="fa-solid fa-spinner fa-spin"></i> جاري جلب الفيديو، يرجى الانتظار...
        </div>

        <div id="downloadStatus">
            <i class="fa-solid fa-circle-notch fa-spin"></i> جاري بدء التحميل التلقائي للملف...
        </div>

        <!-- صندوق النتيجة -->
        <div id="resultArea">
            <img id="videoCover" src="" alt="غلاف الفيديو">
            <h3 id="videoTitle" style="font-size: 14px; margin-bottom: 15px; color: #cbd5e1;"></h3>
            
            <button class="action-btn" id="btnVideo" onclick="downloadFile('video')">
                <i class="fa-solid fa-file-video"></i> تحميل بدون علامة مائية (MP4)
            </button>
            <button class="action-btn music" id="btnAudio" onclick="downloadFile('audio')">
                <i class="fa-solid fa-music"></i> تحميل الصوت فقط (MP3)
            </button>
        </div>

        <!-- إعلان 2: بنر في الوسط -->
        <div class="ad-container" style="min-height: 250px;">
            <span>مساحة إعلانية - Banner Middle</span>
        </div>
    </main>

    <!-- إعلان 3: بنر سفلي -->
    <div class="ad-container" style="margin: 0 auto 10px auto; max-width: 800px;">
        <span>مساحة إعلانية - Banner Bottom</span>
    </div>

    <footer>
        <p>&copy; 2026 SaveTok. جميع الحقوق محفوظة.</p>
    </footer>

    <script>
        // رابط الإعلان المباشر (Direct Link) الخاص بك للربح
        const DIRECT_AD_LINK = "https://example.com/your-ad-link"; 

        let currentVideoUrl = "";
        let currentMusicUrl = "";

        function openAdLink() {
            if (DIRECT_AD_LINK && DIRECT_AD_LINK !== "https://example.com/your-ad-link") {
                window.open(DIRECT_AD_LINK, '_blank');
            }
        }

        async function fetchTikTokVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const loading = document.getElementById('loading');
            const resultArea = document.getElementById('resultArea');

            if (!urlInput) {
                alert('يرجى إدخال رابط الفيديو أولاً!');
                return;
            }

            loading.style.display = 'block';
            resultArea.style.display = 'none';

            try {
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                loading.style.display = 'none';

                if (result.code === 0) {
                    const data = result.data;

                    document.getElementById('videoCover').src = data.cover;
                    document.getElementById('videoTitle').innerText = data.title || 'فيديو تيك توك';
                    
                    // حفظ روابط التحميل في المتغيرات
                    currentVideoUrl = data.play;
                    currentMusicUrl = data.music;

                    resultArea.style.display = 'block';
                } else {
                    alert('تعذر جلب الفيديو. تأكد من صحة الرابط.');
                }
            } catch (error) {
                loading.style.display = 'none';
                alert('حدث خطأ أثناء الاتصال بالسيرفر.');
                console.error(error);
            }
        }

        // دالة التحميل التلقائي الحقيقي للملف
        async function downloadFile(type) {
            // فتح الإعلان المباشر أولاً للأرباح
            openAdLink();

            const fileUrl = (type === 'video') ? currentVideoUrl : currentMusicUrl;
            const extension = (type === 'video') ? 'mp4' : 'mp3';
            const fileName = `TikTok_${Date.now()}.${extension}`;
            const downloadStatus = document.getElementById('downloadStatus');

            if (!fileUrl) {
                alert('الرابط غير متوفر!');
                return;
            }

            downloadStatus.style.display = 'block';

            try {
                // جلب الملف عبر fetch وتحويله لـ Blob لبدء التنزيل التلقائي المباشر
                const res = await fetch(fileUrl);
                const blob = await res.blob();
                
                // إنشاء رابط مؤقت للتنزيل
                const tempUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = tempUrl;
                a.download = fileName;
                
                document.body.appendChild(a);
                a.click(); // ضغطة تلقائية لتنزيل الملف في الهاتف/الكمبيوتر
                
                // تنظيف الرابط المؤقت
                window.URL.revokeObjectURL(tempUrl);
                document.body.removeChild(a);

                downloadStatus.style.display = 'none';
            } catch (err) {
                downloadStatus.style.display = 'none';
                // في حال وجود تقييد CORS محلي، يتم فتح الرابط مباشرة للتنزيل
                const a = document.createElement('a');
                a.href = fileUrl;
                a.download = fileName;
                a.target = '_blank';
                a.click();
            }
        }
    </script>
</body>
</html>
