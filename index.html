<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VeloTok - أداة التحميل السريعة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-card">
    <div class="logo">⚡ VeloTok</div>
    <p class="subtitle">قم بتحميل الفيديوهات بسرعة وسهولة مجاناً</p>
    
    <div class="input-box">
      <input type="url" id="videoUrl" placeholder="ضع رابط الفيديو هنا (TikTok, YouTube, ...)" required>
      <button id="downloadBtn">تحميل</button>
    </div>

    <div id="result"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
